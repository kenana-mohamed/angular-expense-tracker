<div class="app-shell">
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">💰</span>

        <div class="brand-text">
          <h1>Expense Tracker</h1>
          <p>Track, filter and chat about your spending</p>
        </div>
      </div>

      <div class="header-summary" aria-label="Total of all expenses">
        <span class="header-summary-label">All expenses</span>
        <strong>{{ totalExpenses() | currency: 'EGP' : 'symbol' : '1.2-2' }}</strong>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="dashboard-layout">
      <app-expense-form class="dashboard-column" />
      <app-expense-list class="dashboard-column" />
    </div>
  </main>

  <app-chatbot />
</div>
